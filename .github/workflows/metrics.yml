# À placer dans : .github/workflows/metrics.yml  (dépôt soboure69/soboure69)
name: Metrics

on:
  schedule: [{ cron: "0 3 * * *" }]   # mise à jour quotidienne
  workflow_dispatch:                   # lancement manuel
  push: { branches: ["main"] }

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Activité générale
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: soboure69
          template: classic
          filename: github-metrics/general.svg
          base: header, activity, community, repositories
          config_timezone: Europe/Paris

      - name: Langages les plus utilisés
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: soboure69
          template: classic
          filename: github-metrics/languages.svg
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_colors: github

      - name: Trophées
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: soboure69
          template: classic
          filename: github-metrics/achievements.svg
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
